<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account — ThinkAI</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head>
<body class="auth-page" data-page="register"><main class="auth-wrap"><a class="brand auth-brand" href="index.html"><span class="brand-mark"><i class="bi bi-stars"></i></span> think<span>ai</span></a><section class="auth-card"><div class="text-center mb-4"><span class="auth-symbol"><i class="bi bi-person-plus"></i></span><h1>Start your journey</h1><p>Create your account and learn at your pace.</p></div><div class="alert alert-danger d-none" role="alert" id="auth-error"></div><form id="register-form" novalidate><div class="mb-3"><label class="form-label" for="name">Full name</label><input class="form-control" id="name" name="name" type="text" autocomplete="name" placeholder="e.g. Aisha Kumar" required minlength="2"></div><div class="mb-3"><label class="form-label" for="email">Email address</label><input class="form-control" id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div><div class="mb-3"><label class="form-label" for="password">Create password</label><div class="input-group"><input class="form-control" id="password" name="password" type="password" autocomplete="new-password" placeholder="At least 6 characters" required minlength="6"><button class="btn btn-outline-secondary password-toggle" type="button" aria-label="Show password"><i class="bi bi-eye"></i></button></div></div><div class="mb-4"><label class="form-label" for="goal">My learning goal</label><select class="form-select" id="goal" name="goal"><option>Placement preparation</option><option>Competitive exams</option><option>Build problem-solving skills</option><option>College entrance exams</option></select></div><button class="btn btn-primary w-100 btn-lg" type="submit">Create my account <i class="bi bi-arrow-right ms-2"></i></button></form><p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p><div class="demo-note"><i class="bi bi-shield-check me-1"></i> Your demo profile is stored in this browser only.</div></section><a class="back-home" href="index.html"><i class="bi bi-arrow-left"></i> Back to home</a></main><script src="js/auth.js"></script></body>
</html>
