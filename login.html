<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Log in — ThinkAI</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head>
<body class="auth-page" data-page="login"><main class="auth-wrap"><a class="brand auth-brand" href="index.html"><span class="brand-mark"><i class="bi bi-stars"></i></span> think<span>ai</span></a><section class="auth-card"><div class="text-center mb-4"><span class="auth-symbol"><i class="bi bi-stars"></i></span><h1>Welcome back</h1><p>Pick up where your progress left off.</p></div><div class="alert alert-danger d-none" role="alert" id="auth-error"></div><form id="login-form" novalidate><div class="mb-3"><label class="form-label" for="email">Email address</label><input class="form-control" id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div><div class="mb-3"><label class="form-label" for="password">Password</label><div class="input-group"><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required minlength="6"><button class="btn btn-outline-secondary password-toggle" type="button" aria-label="Show password"><i class="bi bi-eye"></i></button></div></div><div class="d-flex justify-content-between align-items-center mb-4"><div class="form-check"><input class="form-check-input" type="checkbox" id="remember" checked><label class="form-check-label" for="remember">Remember me</label></div><a href="#" class="text-link" id="demo-login">Use demo account</a></div><button class="btn btn-primary w-100 btn-lg" type="submit">Log in <i class="bi bi-arrow-right ms-2"></i></button></form><p class="auth-switch">New to ThinkAI? <a href="register.html">Create an account</a></p><div class="demo-note"><i class="bi bi-info-circle me-1"></i> Demo: use any email and password (6+ characters).</div></section><a class="back-home" href="index.html"><i class="bi bi-arrow-left"></i> Back to home</a></main><script src="js/auth.js"></script></body>
</html>
